<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #e6f7ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 150, 0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 30px;
            border-bottom: 2px solid #cce7ff;
            padding-bottom: 10px;
        }
        
        .question-container {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f0f9ff;
            border-left: 4px solid #4da6ff;
        }
        
        .question-number {
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .question-text {
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            background-color: white;
            border: 1px solid #cce7ff;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option:hover {
            background-color: #e6f2ff;
        }
        
        .option.selected {
            background-color: #cce7ff;
            border-color: #4da6ff;
        }
        
        .option-number {
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: #4da6ff;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .submit-btn {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .submit-btn:hover {
            background-color: #0052a3;
        }
        
        .result {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
        
        .correct {
            background-color: #e6ffe6;
            color: #006600;
            border: 1px solid #99cc99;
        }
        
        .incorrect {
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #ff9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>India Quiz</h1>
        
        <div id="quiz-container">
            <!-- Questions will be inserted here by JavaScript -->
        </div>
        
        <button class="submit-btn" id="submit-btn">Submit Answers</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        // Quiz questions and answers
        const quizData = [
            {
                question: "What is the capital of India?",
                options: ["Mumbai", "Kolkata", "New Delhi", "Chennai"],
                correct: 2
            },
            {
                question: "Which river is considered the most sacred in India?",
                options: ["Yamuna", "Ganga", "Brahmaputra", "Godavari"],
                correct: 1
            },
            {
                question: "Who was the first Prime Minister of India?",
                options: ["Mahatma Gandhi", "Jawaharlal Nehru", "Sardar Patel", "Indira Gandhi"],
                correct: 1
            },
            {
                question: "Which Indian city is known as the Pink City?",
                options: ["Jaipur", "Jodhpur", "Udaipur", "Jaisalmer"],
                correct: 0
            },
            {
                question: "What is the national animal of India?",
                options: ["Lion", "Elephant", "Royal Bengal Tiger", "Peacock"],
                correct: 2
            },
            {
                question: "Which festival is known as the Festival of Lights in India?",
                options: ["Holi", "Diwali", "Eid", "Christmas"],
                correct: 1
            },
            {
                question: "Which monument is located in Agra?",
                options: ["Qutub Minar", "Red Fort", "Taj Mahal", "India Gate"],
                correct: 2
            },
            {
                question: "What is the currency of India?",
                options: ["Rupee", "Dollar", "Yen", "Euro"],
                correct: 0
            },
            {
                question: "Which Indian state has the longest coastline?",
                options: ["Kerala", "Tamil Nadu", "Maharashtra", "Gujarat"],
                correct: 3
            },
            {
                question: "Who wrote the Indian national anthem?",
                options: ["Rabindranath Tagore", "Bankim Chandra Chatterjee", "Sarojini Naidu", "Mahatma Gandhi"],
                correct: 0
            },
            {
                question: "Which is the largest state in India by area?",
                options: ["Madhya Pradesh", "Maharashtra", "Rajasthan", "Uttar Pradesh"],
                correct: 2
            },
            {
                question: "What is the national bird of India?",
                options: ["Sparrow", "Peacock", "Parrot", "Eagle"],
                correct: 1
            },
            {
                question: "Which Indian city is known as the Silicon Valley of India?",
                options: ["Hyderabad", "Pune", "Bangalore", "Chennai"],
                correct: 2
            },
            {
                question: "In which year did India gain independence?",
                options: ["1945", "1947", "1950", "1942"],
                correct: 1
            },
            {
                question: "Which is the highest mountain peak in India?",
                options: ["Mount Everest", "Kanchenjunga", "Nanda Devi", "Kamet"],
                correct: 1
            },
            {
                question: "Which Indian state is known as the 'Land of Five Rivers'?",
                options: ["Haryana", "Punjab", "Uttarakhand", "Himachal Pradesh"],
                correct: 1
            },
            {
                question: "Who is known as the Father of the Indian Constitution?",
                options: ["Mahatma Gandhi", "Jawaharlal Nehru", "B.R. Ambedkar", "Sardar Patel"],
                correct: 2
            },
            {
                question: "Which is the national sport of India?",
                options: ["Cricket", "Hockey", "Football", "Kabaddi"],
                correct: 1
            },
            {
                question: "Which Indian city is located on the banks of the river Hooghly?",
                options: ["Mumbai", "Kolkata", "Patna", "Varanasi"],
                correct: 1
            },
            {
                question: "Which is the smallest state in India by area?",
                options: ["Goa", "Sikkim", "Tripura", "Nagaland"],
                correct: 0
            }
        ];

        // Initialize the quiz
        document.addEventListener('DOMContentLoaded', function() {
            const quizContainer = document.getElementById('quiz-container');
            
            // Create question elements
            quizData.forEach((questionData, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container';
                
                const questionNumber = document.createElement('div');
                questionNumber.className = 'question-number';
                questionNumber.textContent = `Question ${index + 1}`;
                
                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.textContent = questionData.question;
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                
                // Create option elements
                questionData.options.forEach((option, optionIndex) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    optionDiv.dataset.optionIndex = optionIndex;
                    
                    const optionNumber = document.createElement('span');
                    optionNumber.className = 'option-number';
                    optionNumber.textContent = optionIndex + 1;
                    
                    const optionText = document.createElement('span');
                    optionText.textContent = option;
                    
                    optionDiv.appendChild(optionNumber);
                    optionDiv.appendChild(optionText);
                    
                    // Add click event to select option
                    optionDiv.addEventListener('click', function() {
                        // Remove selected class from all options in this question
                        const allOptions = optionsDiv.querySelectorAll('.option');
                        allOptions.forEach(opt => opt.classList.remove('selected'));
                        
                        // Add selected class to clicked option
                        this.classList.add('selected');
                        
                        // Store the selected answer
                        questionData.selected = optionIndex;
                    });
                    
                    optionsDiv.appendChild(optionDiv);
                });
                
                questionDiv.appendChild(questionNumber);
                questionDiv.appendChild(questionText);
                questionDiv.appendChild(optionsDiv);
                
                quizContainer.appendChild(questionDiv);
            });
            
            // Add event listener to submit button
            document.getElementById('submit-btn').addEventListener('click', function() {
                let score = 0;
                let resultsHTML = '';
                
                // Check answers
                quizData.forEach((questionData, index) => {
                    if (questionData.selected === questionData.correct) {
                        score++;
                        resultsHTML += `<div class="result correct">Question ${index + 1}: Correct!</div>`;
                    } else {
                        resultsHTML += `<div class="result incorrect">Question ${index + 1}: Incorrect. The correct answer is: ${questionData.options[questionData.correct]}</div>`;
                    }
                });
                
                // Display results
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `<h2>Your Score: ${score}/${quizData.length}</h2>` + resultsHTML;
                resultDiv.style.display = 'block';
                
                // Scroll to results
                resultDiv.scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
