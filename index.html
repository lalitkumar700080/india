            50% { transform: translateY(-10px); }

            padding: 25px 15px;
            background: linear-gradient(45deg, #00c6ff, #0072ff, #8e2de2);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.05) 10px,
                rgba(255,255,255,0.05) 20px
            );
            animation: stripeMove 20s linear infinite;
        }

        @keyframes stripeMove {
            0% { transform: translateX(-50%) translateY(-50%); }
            100% { transform: translateX(0%) translateY(0%); }
        }

        .flag {
            width: 130px;
            height: 78px;
            margin: 0 auto 12px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: wave 2.5s ease-in-out infinite;

        .saffron { background: #ff9933; }
        .white { background: #ffffff; position: relative; }

            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);

            border: 2.5px solid #000080;
            border-radius: 50%;
            background: radial-gradient(circle, #000080 35%, transparent 35%);
            animation: spin 4s linear infinite;

            from { transform: translate(-50%, -50%) rotate(0deg); }

            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);

        let current = 0;
        let score = 0;
        let selected = false;

        const qEn = document.getElementById('question-en');
        const qHi = document.getElementById('question-hi');
        const opts = document.getElementById('options');
        const nextBtn = document.getElementById('next');
        const scoreEl = document.getElementById('score');

        function loadQuestion() {
            const q = questions[current];
            qEn.textContent = (current + 1) + ". " + q.en;
            qHi.textContent = q.hi;
            opts.innerHTML = '';

            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <div>${String.fromCharCode(65 + i)}. ${opt}</div>
                    <div>${q.hiOptions[i]}</div>
                `;
                div.onclick = () => selectAnswer(i);
                opts.appendChild(div);
            });

            nextBtn.disabled = true;
            nextBtn.textContent = "अगला प्रश्न";
            selected = false;
        }

        function selectAnswer(idx) {
            if (selected) return;
            selected = true;

            const q = questions[current];
            const children = opts.children;

            for (let i = 0; i < children.length; i++) {
                if (i === q.correct) {
                    children[i].classList.add('correct');
                } else if (i === idx) {
                    children[i].classList.add('wrong');
                }
                // disable further clicks
                children[i].onclick = null;
            }

            if (idx === q.correct) {
                score++;
            }
            scoreEl.textContent = `स्कोर: ${score} / ${questions.length}`;

            nextBtn.disabled = false;
        }

        nextBtn.onclick = () => {
            current++;
            if (current < questions.length) {
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                qEn.textContent = "क्विज़ पूरा हुआ!";
                qHi.textContent = `अंतिम स्कोर: ${score} / ${questions.length}`;
                opts.innerHTML = '';
                nextBtn.style.display = 'none';
                // Optionally show restart button
                const restart = document.createElement('button');
                restart.textContent = 'फिर से खेलें';
                restart.style.display = 'block';
                restart.style.margin = '20px auto';
                restart.style.padding = '12px 20px';
                restart.style.borderRadius = '30px';
                restart.style.border = 'none';
                restart.style.fontWeight = '700';
                restart.onclick = () => location.reload();
                document.querySelector('.content').appendChild(restart);
            }
        };
